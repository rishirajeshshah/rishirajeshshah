version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp
      POSTGRES_DB: isp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp -d isp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── App Services ────────────────────────────────────────────────────────────

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://isp:isp@postgres:5432/isp
      DATABASE_URL_SYNC: postgresql+psycopg2://isp:isp@postgres:5432/isp
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"  # Run once and exit

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://isp:isp@postgres:5432/isp
      DATABASE_URL_SYNC: postgresql+psycopg2://isp:isp@postgres:5432/isp
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app  # Hot-reload: mount source for development
    restart: unless-stopped

  worker:
    build: .
    command: >
      celery -A src.worker.celery_app.celery_app worker
      --loglevel=info
      --queues=sync,webhooks
      --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://isp:isp@postgres:5432/isp
      DATABASE_URL_SYNC: postgresql+psycopg2://isp:isp@postgres:5432/isp
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
    restart: unless-stopped

  # ── Optional: Celery monitoring UI ─────────────────────────────────────────
  flower:
    build: .
    command: >
      celery -A src.worker.celery_app.celery_app flower
      --port=5555
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      - redis
      - worker
    profiles:
      - monitoring  # Only start with: docker compose --profile monitoring up

volumes:
  postgres_data:
  redis_data:
